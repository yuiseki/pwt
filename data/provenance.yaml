checked:
  note: scripts/02_verify.py, with DuckDB, before upload
  items:
    - every raw file against MANIFEST.json (size, sha256, DataverseNL SHA-1); zip and xlsx CRC
    - each subset has the row count its Stata file states
    - every value of each subset equals the value read from the Stata file, compared one by one
    - where an xlsx of the same table exists, its row count equals the Stata file's (8.1 main table excepted, 3 more rows in the xlsx)
    - where an xlsx exists, every value agrees with it read by DuckDB's excel extension, within a relative 1e-6 (5e-4 for the national accounts of 8.1 and 9.0)
    - the (countrycode, country) pairs of each main table equal those of its xlsx
    - every column of the type its name gives
    - a DuckDB without extensions opens every file
    - no bloom filters

modifications:
  raw: none. GGDC's files, byte for byte.
  parquet:
    - made from the Stata files (for 8.0 and 8.1 the Stata file inside the zip), read with src/dta.py
    - columns typed by name; a value that does not fit stops the build
    - 4-byte floats widened exactly to DOUBLE; integers stored as DOUBLE where the rule says DOUBLE
    - year (and i_mix) as INTEGER, also where the Stata file stores a float
    - value-labelled codes (i_cig, i_xm, i_xr, i_outlier, i_irr and the coded columns of labor_detail) written as their labels
    - Stata missing values and empty strings as NULL
    - pwt81.dta decoded as Mac Roman (one byte, 0x99, in Cote d'Ivoire)
    - rows in the order of the Stata file
    - written with zstd, without bloom filters
