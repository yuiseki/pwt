# Where this data comes from and what was done to it.

source:
  name: Penn World Table (PWT)
  publisher: Groningen Growth and Development Centre (GGDC), Faculty of Economics and Business, University of Groningen
  current_release: https://www.rug.nl/ggdc/productivity/pwt/
  earlier_releases: https://www.rug.nl/ggdc/productivity/pwt/earlier-releases
  hosting: 11.0 and 10.01 on DataverseNL (files and SHA-1 from its public API); 10.0 and earlier as files under https://www.rug.nl/ggdc/docs/
  licence:
    applied: CC BY 4.0 (each release page, read 2026-10-05; DataverseNL records of 11.0 and 10.01)
    licensors: Robert C. Feenstra, Robert Inklaar and Marcel P. Timmer
    attribution_required: true
    citation_required: 'Feenstra, Robert C., Robert Inklaar and Marcel P. Timmer (2015), "The Next Generation of the Penn World Table", American Economic Review, 105(10), 3150-3182'
    share_alike: false
    not_checked: the terms of third-party input data inside the program packages
  not_taken: ICP benchmark workbooks (icp19xx.xls) linked as separate files, the AER article, releases 7.1 and earlier (their pages state no licence)

releases:
  note: |
    Each release is kept whole: every file its page links, byte for byte,
    under raw/<release>/, listed in MANIFEST.json. Files linked from more
    than one page are kept in each release that links them. Tables are
    made into Parquet from their Stata files; the main table of a release
    is the subset named by the release, the others '<release>.<table>'.
